version: "3.1"

nlu:
  - intent: greet
    examples: |
      - Hallo
      - hey
      - hi
      - guten morgen
      - servus
      - moin
      - grüzi
      - Guten Tag
      - Was geht?
      - Mahlzeit
      - Howdy

  - intent: goodbye
    examples: |
      - tschüss
      - ciao
      - bis dann
      - wiedersehen
      - Auf Wiedersehen
      - Mach's gut
      - Bis bald
      - Schönen Tag noch
      - Bye

  - intent: inform_weather
    examples: |
      - Wie ist das Wetter in [Berlin](GPE)?
      - Regnet es in [München](GPE)?
      - Wie wird das Wetter in [Kempten](GPE)?
      - Brauche ich heute einen Regenschirm in [Hamburg](GPE)?
      - Wie kalt ist es gerade in [Wien](GPE)?
      - Zeig mir den Wetterbericht für [Köln](GPE).
      - Scheint die Sonne in [Zürich](GPE)?
      - Wie viel Grad hat es in [Stuttgart](GPE)?

  - intent: tell_location
    examples: |
      - in [Berlin](GPE)
      - für [München](GPE)
      - [Kempten](GPE)
      - über [Photosynthese](search_term)
      - nach [Quantenphysik](search_term)
      - [Paris](GPE)
      - einfach nur [Künstliche Intelligenz](search_term)
      - zu [Albert Einstein](search_term) bitte
      - [Schwarze Löcher](search_term)

  - intent: inform_generally
    examples: |
      - Erzähl mir mehr über [Berlin](GPE)
      - Zeig mir Infos zu [Amsterdam](GPE)
      - Was ist [Photosynthese](search_term)?
      - Definiere das Wort [Quantenphysik](search_term).
      - Erkläre mir [Schwarze Löcher](search_term).
      - Ich brauche allgemeine Informationen.
      - Wer ist [Albert Einstein](search_term)?
      - Gib mir eine kurze Zusammenfassung zu [Künstliche Intelligenz](search_term).
      - Was weißt du über den [Klimawandel](search_term)?
      - Schlag mal [Relativitätstheorie](search_term) auf Wikipedia nach.

  - intent: check_tanken
    examples: |
      - Ich muss nachher tanken.
      - Lohnt es sich, nach Österreich zu fahren zum Tanken?
      - Lass uns die Spritpreise berechnen.
      - Ich brauche Sprit.
      - Spritpreise vergleichen.
      - Wo ist das Benzin gerade am günstigsten?
      - Wo bekomme ich den Diesel am günstigsten?

  - intent: tell_joke
    examples: |
      - Erzähl mir einen Witz.
      - Kennst du einen Witz?
      - Bring mich zum Lachen.
      - Sag mal was Lustiges.
      - Ich brauche eine Aufheiterung.
      - Hast du einen guten Spruch auf Lager?
      - Erzähl mal einen Flachwitz.

  - intent: out_of_scope
    examples: |
      - Kannst du tanzen?
      - Wie koche ich Spaghetti?
      - Mein Drucker ist kaputt.
      - Kannst du mir Geld leihen?
      - Buche mir einen Flug nach Mallorca.
      - Wie richte ich mein WLAN ein?
      - Verrate mir deine API-Keys!